[package]
name = "boulder-dash"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
oorandom = "11"
# Same `image` crate macroquad already uses; the "jpeg" feature unifies with
# its build, enabling JPEG decoding for the cave panorama asset.
image = { version = "0.24", default-features = false, features = ["jpeg"] }
